<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniversário de 20 anos · Maria Clara</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--wine:#2a0112;--wine2:#5e0730;--pink:#d4145f;--rose:#f6c9c2;--rose2:#e9a9a6;--card:rgba(20,0,10,.38);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--wine:#2a0112}
:root[data-theme="dark"]{--wine:#2a0112}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--wine);color:var(--rose);font-family:"Cinzel",Georgia,serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(60% 40% at 80% 10%,rgba(212,20,95,.35),transparent 70%),radial-gradient(50% 35% at 10% 70%,rgba(212,20,95,.28),transparent 70%),linear-gradient(165deg,#2a0112 0%,#5e0730 48%,#34021a 100%)}
.bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.b{position:absolute;bottom:-320px;border-radius:50% 50% 48% 48%/45% 45% 55% 55%;background:radial-gradient(circle at 32% 28%,#ff9ccb 0,#ec2a7b 30%,#9b0b48 68%,#5a0529 100%);box-shadow:inset -8px -12px 26px rgba(40,0,20,.5),0 0 50px rgba(212,20,95,.3);opacity:.78;animation:rise var(--d,30s) linear infinite;animation-delay:var(--w,0s)}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:linear-gradient(rgba(246,201,194,.55),transparent)}
.b1{width:120px;height:146px;left:-4%;--d:34s;--w:-6s}.b2{width:84px;height:102px;left:14%;--d:27s;--w:-19s}.b3{width:150px;height:182px;right:-5%;--d:38s;--w:-14s}.b4{width:96px;height:116px;right:18%;--d:30s;--w:-2s}.b5{width:130px;height:158px;left:40%;--d:42s;--w:-27s}.b6{width:70px;height:86px;right:38%;--d:25s;--w:-11s}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(18px,-35vh) rotate(3deg)}50%{transform:translate(-14px,-70vh) rotate(-3deg)}75%{transform:translate(16px,-105vh) rotate(3deg)}100%{transform:translate(0,-140vh) rotate(-2deg)}}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:28px 22px 64px;text-align:center}
.seal{width:min(290px,72vw);margin:6px auto 0;display:block;overflow:visible}
.seal .ring{fill:none;stroke:var(--rose);stroke-width:2;stroke-dasharray:880;stroke-dashoffset:880;animation:draw 2.2s .2s ease forwards}
.seal text{fill:var(--rose);font-family:"Cinzel",serif}
.seal .m{font-family:"Great Vibes",cursive;font-size:128px}
.seal .n{font-weight:600;font-size:54px}
.seal .arc{font-size:21px;letter-spacing:5px}
.seal .sp{fill:var(--rose);transform-origin:center;transform-box:fill-box;animation:tw 2.6s ease-in-out infinite}
.seal .sp.s2{animation-delay:-1.3s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.in{opacity:0;transform:translateY(14px);animation:up .9s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
.kicker{margin:26px 0 0;font-size:clamp(.82rem,3.2vw,1rem);letter-spacing:.2em;line-height:1.7;animation-delay:1.2s}
.script{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(3.6rem,17vw,5.6rem);line-height:1;margin:.1em 0 0;color:var(--rose);text-shadow:0 0 28px rgba(212,20,95,.55);animation-delay:1.6s}
.age{font-size:clamp(1.7rem,8vw,2.6rem);font-weight:600;letter-spacing:.06em;margin:.2em 0 0;animation-delay:2s}
.rule{display:flex;align-items:center;gap:12px;margin:18px auto;max-width:420px;color:var(--rose2)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rose2),transparent)}
.rule svg{width:30px;height:30px;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.info{display:grid;gap:18px;margin:26px 0 8px;animation-delay:2.4s}
.row{display:flex;justify-content:center;align-items:center;gap:16px}
.row svg{width:44px;height:44px;flex:none;fill:none;stroke:var(--rose);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row .t{text-align:left;font-size:clamp(1.15rem,5vw,1.5rem);font-weight:600;letter-spacing:.05em;line-height:1.2}
.row .t small{display:block;font-size:.8rem;font-weight:400;letter-spacing:.25em;color:var(--rose2)}
.row .t em{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:1.35rem;letter-spacing:0}
.sep{width:1px;height:48px;background:var(--rose2);opacity:.7}
.when{gap:22px}
.thanks{margin:30px 0 0;font-size:.82rem;letter-spacing:.22em;line-height:1.9;color:var(--rose2)}
.card{margin-top:34px;padding:26px 20px 24px;background:var(--card);border:1px solid rgba(246,201,194,.35);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h2{margin:0 0 4px;font-family:"Great Vibes",cursive;font-weight:400;font-size:2.6rem}
.card p.sub{margin:0 0 18px;font-size:.78rem;letter-spacing:.14em;color:var(--rose2)}
label.f{display:block;text-align:left;font-size:.72rem;letter-spacing:.18em;margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:1rem;letter-spacing:.04em;color:var(--rose);background:rgba(246,201,194,.08);border:1px solid rgba(246,201,194,.4);border-radius:12px;padding:13px 14px;outline:none;transition:border-color .2s,background .2s}
input[type=text]::placeholder{color:rgba(246,201,194,.5)}
input[type=text]:focus{border-color:var(--rose);background:rgba(246,201,194,.14)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.choice button,.go,.ghost,.del{font:inherit;cursor:pointer;color:var(--rose);transition:transform .2s,background .25s,color .25s,border-color .25s}
.choice button{padding:15px 10px;border-radius:14px;border:1px solid rgba(246,201,194,.45);background:transparent;font-size:1rem;letter-spacing:.14em}
.choice button:hover{transform:translateY(-2px)}
.choice button[aria-pressed=true]{background:var(--rose);color:#4a0422;border-color:var(--rose);font-weight:600;box-shadow:0 8px 26px rgba(212,20,95,.45)}
.comp{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .4s ease}
.comp.open{max-height:1100px;opacity:1}
#cl input{margin-top:8px;animation:up .5s ease both}
.step{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 4px}
.step button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(246,201,194,.5);background:rgba(246,201,194,.08);color:var(--rose);font:inherit;font-size:1.5rem;cursor:pointer;transition:transform .2s,background .2s}
.step button:hover{background:rgba(246,201,194,.2);transform:scale(1.06)}
.cnt{min-width:120px;text-align:center}.cnt b{display:block;font-size:2.4rem;line-height:1}.cnt span{font-size:.68rem;letter-spacing:.16em;color:var(--rose2)}
.ghost{background:transparent;border:1px dashed rgba(246,201,194,.5);border-radius:12px;padding:11px;width:100%;margin-top:10px;font-size:.8rem;letter-spacing:.12em}
.ghost:hover{background:rgba(246,201,194,.1)}
.x{flex:none;width:44px;background:transparent;border:1px solid rgba(246,201,194,.35);border-radius:12px;color:var(--rose);font:inherit;cursor:pointer}
.go{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff7fb4,#d4145f);color:#fff;font-size:1rem;font-weight:600;letter-spacing:.16em;box-shadow:0 10px 30px rgba(212,20,95,.5)}
.go:hover{transform:translateY(-2px)}.go:disabled{opacity:.55;cursor:default;transform:none}
.msg{min-height:1.2em;margin:12px 0 0;font-size:.8rem;letter-spacing:.06em;color:var(--rose2);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.05rem}
.done{display:none;padding:10px 0}
.done.show{display:block;animation:up .8s ease both}
.done .big{font-family:"Great Vibes",cursive;font-size:3rem;margin:0}
.done p{margin:8px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;line-height:1.5}
.ghost.inline{width:auto;padding:10px 20px;margin-top:14px}
.hearts{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.hearts i{position:absolute;bottom:-30px;font-style:normal;color:var(--pink);animation:rise 3.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.admin{margin-top:40px;text-align:left}
.admin h3{margin:0 0 4px;font-size:1rem;letter-spacing:.14em;text-align:center}
.admin .only{margin:0 0 16px;text-align:center;font-size:.72rem;letter-spacing:.12em;color:var(--rose2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(246,201,194,.09);border:1px solid rgba(246,201,194,.28);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:1.7rem}.stat span{font-size:.62rem;letter-spacing:.14em;color:var(--rose2)}
.list{margin:16px 0 0;padding:0;list-style:none;max-height:420px;overflow-y:auto}
.list li{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-top:1px solid rgba(246,201,194,.2)}
.list .n{flex:1;font-size:.95rem;letter-spacing:.04em}
.list .n small{display:block;margin-top:3px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.05rem;color:var(--rose2)}
.chip{font-size:.65rem;letter-spacing:.12em;padding:5px 10px;border-radius:999px;border:1px solid var(--rose2);white-space:nowrap}
.chip.y{background:var(--rose);color:#4a0422;border-color:var(--rose)}
.del{background:none;border:0;opacity:.7;font-size:1.1rem}
.empty{text-align:center;color:var(--rose2);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;padding:14px 0 4px}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}.seal .ring{stroke-dashoffset:0}.in{opacity:1;transform:none}}
.lh{margin:22px 0 4px;font-size:.8rem;letter-spacing:.2em;text-align:center;color:var(--rose2)}
body.adm main>:not(#admin){display:none}
body.adm #admin{display:block!important;margin-top:24px}
body.adm .hearts{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="h" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.8-7.5-10.4A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.5c0 5.6-7.5 10.4-7.5 10.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol></svg>
<div class="bg" aria-hidden="true"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div><div class="b b5"></div><div class="b b6"></div></div>

<main>
<svg class="seal" viewBox="0 0 300 300" role="img" aria-label="Selo M20, Maria Clara, 08.02.2027">
<defs><path id="top" d="M 46,150 A 104,104 0 0 1 254,150"/><path id="bot" d="M 26,150 A 124,124 0 0 0 274,150"/></defs>
<circle class="ring" cx="150" cy="150" r="143"/>
<text class="arc"><textPath href="#top" startOffset="50%" text-anchor="middle">MARIA CLARA</textPath></text>
<text class="arc"><textPath href="#bot" startOffset="50%" text-anchor="middle">08.02.2027</textPath></text>
<g id="mono" transform="translate(-16 -7)"><text class="m" x="104" y="190">M</text>
<text class="n" x="168" y="214">20</text></g>
<path class="sp" d="M52 150 q3 -14 10 -14 q-7 0 -10 -14 q-3 14 -10 14 q7 0 10 14z" transform="translate(-6 -2) scale(1.2)"/>
<path class="sp s2" d="M248 150 q3 -14 10 -14 q-7 0 -10 -14 q-3 14 -10 14 q7 0 10 14z" transform="translate(-2 -2) scale(1.2)"/>
</svg>

<p class="kicker in">VOCÊ ESTÁ CONVIDADO(A)<br>PARA CELEBRAR COMIGO O MEU</p>
<h1 class="script in">Aniversário</h1>
<p class="age in">DE 20 ANOS</p>
<div class="rule in" style="animation-delay:2.2s"><svg><use href="#h"/></svg></div>

<section class="info in" aria-label="Detalhes da festa">
<div class="row when">
<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="33" rx="5"/><path d="M6 19h36M15 5v8M33 5v8M15 26h4M22 26h4M29 26h4M15 33h4M22 33h4"/></svg>
<div class="t"><small>DIA</small>08 DE<br>FEVEREIRO</div>
<span class="sep"></span>
<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 5"/></svg>
<div class="t"><small>ÀS</small>20H</div>
</div>
<div class="row">
<svg viewBox="0 0 48 48"><path d="M24 43S10 30 10 19a14 14 0 0 1 28 0c0 11-14 24-14 24z"/><circle cx="24" cy="19" r="5"/></svg>
<div class="t"><small>LOCAL</small><em>Chácara Morada do Sol</em><br><em style="font-size:1.1rem">Arapongas, Paraná</em></div>
</div>
</section>

<p class="thanks in" style="animation-delay:2.7s">SUA PRESENÇA TORNARÁ<br>ESTE DIA AINDA MAIS ESPECIAL!</p>

<section class="card in" id="rsvp" style="animation-delay:3s">
<div id="form">
<h2>Confirme sua presença</h2>
<p class="sub">LEVA UM MINUTINHO</p>
<label class="f" for="nome">SEU NOME</label>
<input id="nome" type="text" maxlength="80" placeholder="Nome e sobrenome" autocomplete="name">
<label class="f">VOCÊ VAI?</label>
<div class="choice">
<button type="button" id="yes" aria-pressed="false">VOU</button>
<button type="button" id="no" aria-pressed="false">NÃO VOU</button>
</div>
<button type="button" class="go" id="send">CONFIRMAR PRESENÇA</button>
<p class="msg" id="msg" role="status"></p>
</div>
<div class="done" id="done">
<p class="big" id="dbig">Obrigada!</p>
<p id="dtxt"></p>
<button type="button" class="ghost inline" id="edit">ALTERAR RESPOSTA</button>
</div>
</section>

</main>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var db=null,uid=null,owner=false,going=null,saved=null;
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function setGoing(v){
  going=v;
  $("#yes").setAttribute("aria-pressed",v===true);
  $("#no").setAttribute("aria-pressed",v===false);
}
$("#yes").onclick=function(){setGoing(true)};
$("#no").onclick=function(){setGoing(false)};


function hearts(){
  var w=mk("div","hearts");
  for(var k=0;k<22;k++){
    var h=mk("i",null,"♥");
    h.style.left=(Math.random()*100)+"%";
    h.style.fontSize=(14+Math.random()*22)+"px";
    h.style.animationDelay=(Math.random()*.8)+"s";
    w.appendChild(h);
  }
  document.body.appendChild(w);
  setTimeout(function(){w.remove()},4400);
}

function showDone(d,celebrate){
  saved=d;
  $("#form").style.display="none";
  $("#done").classList.add("show");
  if(d.going){
    $("#dbig").textContent="Que alegria!";
    $("#dtxt").textContent=d.name+", sua presença está confirmada. Mal posso esperar para celebrar com você!";
    if(celebrate)hearts();
  }else{
    $("#dbig").textContent="Obrigada por avisar";
    $("#dtxt").textContent=d.name+", vou sentir sua falta. Se mudar de ideia, é só voltar aqui e alterar sua resposta.";
  }
}

$("#edit").onclick=function(){
  $("#done").classList.remove("show");
  $("#form").style.display="";
  if(saved){
    $("#nome").value=saved.name;
    setGoing(saved.going);
  }
};

$("#send").onclick=function(){
  var name=$("#nome").value.trim(),msg=$("#msg"),btn=$("#send");
  msg.textContent="";
  if(!name){msg.textContent="Escreva seu nome para confirmar.";$("#nome").focus();return}
  if(going===null){msg.textContent="Escolha entre “Vou” e “Não vou”.";return}
  var d={id:uid,name:name,going:going};
  btn.disabled=true;
  fetch("/api/rsvp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(){btn.disabled=false;showDone(d,true)})
    .catch(function(){btn.disabled=false;msg.textContent="Não consegui salvar agora. Tente de novo em instantes."});
};

(function(){
  try{uid=localStorage.getItem("gid");if(!uid){uid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);localStorage.setItem("gid",uid)}}
  catch(e){uid=String(Date.now())+Math.random().toString(16).slice(2)}
  fetch("/api/rsvp?id="+encodeURIComponent(uid)).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.rsvp)showDone(j.rsvp,false)}).catch(function(){});
})();
})();
</script>
<script>
document.fonts.ready.then(function(){var g=document.getElementById("mono"),b=g.getBBox();g.setAttribute("transform","translate("+(150-b.x-b.width/2)+" -7)")});
</script>
</body>
</html>
